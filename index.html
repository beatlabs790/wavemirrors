<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaveMirror | Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loader"><div class="spinner"></div></div>
    <a href="https://instagram.com/_beat_labs" target="_blank" class="insta-float">@_beat_labs</a>

    <header class="glass-nav">
        <div class="logo"><img src="https://i.ibb.co/HTGQy0yG/logo.png" alt="WaveMirror" style="height:35px;"></div>
        <input type="text" id="searchInput" placeholder="Search..." onkeypress="if(event.key==='Enter') searchMovies()">
    </header>

    <div class="genre-bar">
        <button onclick="loadGenre(28)">Action</button><button onclick="loadGenre(35)">Comedy</button>
        <button onclick="loadGenre(27)">Horror</button><button onclick="loadGenre(878)">Sci-Fi</button>
    </div>

    <section id="hero-banner" class="hero"><div class="hero-content"><h1 id="hero-title">Welcome</h1><button id="hero-play" class="btn-primary">▶ Play Now</button></div></section>

    <main class="container">
        <h2 class="section-label">Trending Movies</h2>
        <div id="movie-grid" class="movie-grid"></div>
        <h2 class="section-label">Popular TV Shows</h2>
        <div id="tv-grid" class="movie-grid"></div>
    </main>

    <div id="player-modal" class="hidden">
        <div class="player-container glass-card">
            <div class="player-header"><h2 id="playing-title">Movie</h2><button onclick="closePlayer()" class="close-btn">×</button></div>
            <div class="iframe-container"><iframe id="video-player" src="" allowfullscreen frameborder="0" referrerpolicy="origin"></iframe></div>
            <div class="player-footer">
                <div id="tv-controls" class="hidden"><select id="season-select" onchange="updateTvStream()"></select><select id="episode-select" onchange="updateTvStream()"></select></div>
                <div class="server-btns"><button onclick="loadServer(1)">S1</button><button onclick="loadServer(2)">S2</button></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
