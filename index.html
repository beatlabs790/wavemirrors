<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaveMirror | Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader"><div class="spinner"></div></div>

    <!-- Insta Button -->
    <a href="https://instagram.com/_beat_labs" target="_blank" class="insta-float">@_beat_labs</a>

    <header class="glass-nav">
        <div class="logo">WAVE<span>MIRROR</span></div>
        <input type="text" id="searchInput" placeholder="Search..." onkeypress="if(event.key==='Enter') searchMovies()">
    </header>

    <main class="container">
        <!-- Player -->
        <section id="player-wrapper" class="hidden glass-card">
            <div class="iframe-container">
                <iframe id="video-player" src="" allowfullscreen frameborder="0" referrerpolicy="origin"></iframe>
            </div>
            <div class="controls">
                <h2 id="playing-title">Movie</h2>
                <div class="server-btns">
                    <button onclick="loadServer(1)">S1</button>
                    <button onclick="loadServer(2)">S2</button>
                    <button onclick="loadServer(3)">S3</button>
                    <button onclick="closePlayer()" class="close">×</button>
                </div>
            </div>
        </section>

        <!-- Sections -->
        <h2 class="section-label">Trending Now</h2>
        <div id="movie-grid" class="movie-grid"></div>

        <h2 class="section-label">Top Rated</h2>
        <div id="top-grid" class="movie-grid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
